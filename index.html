<!DOCTYPE html>

<html lang="kk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#FFD000">

<title>O Go — Осакаровка</title>

<style>

:root{

  --yellow:#FFD000;

  --black:#111111;

  --white:#ffffff;

  --bg:#f5f5f3;

  --gray:#777;

  --line:#e7e7e4;

  --radius:18px;

}

*{

  box-sizing:border-box;

}

html{

  scroll-behavior:smooth;

}

body{

  margin:0;

  background:var(--bg);

  color:var(--black);

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

}

button,

input,

textarea{

  font:inherit;

}

button{

  cursor:pointer;

}

.app{

  width:100%;

  max-width:600px;

  min-height:100vh;

  margin:auto;

  background:#fff;

}

/* HEADER */

.header{

  position:sticky;

  top:0;

  z-index:100;

  background:#fff;

  border-bottom:1px solid var(--line);

  padding:12px 15px;

}

.header-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.logo{

  font-size:28px;

  font-weight:900;

  letter-spacing:-1.5px;

}

.location{

  margin-top:2px;

  color:#666;

  font-size:13px;

}

.cart-button{

  border:0;

  background:#111;

  color:#fff;

  border-radius:14px;

  padding:10px 13px;

  font-weight:800;

}

.cart-count{

  display:inline-block;

  min-width:22px;

  padding:2px 6px;

  margin-left:4px;

  border-radius:8px;

  background:var(--yellow);

  color:#111;

}

/* CONTENT */

.content{

  padding:14px 14px 90px;

}

.page{

  display:none;

}

.page.active{

  display:block;

}

/* HOME */

.hero{

  position:relative;

  overflow:hidden;

  min-height:165px;

  margin-bottom:14px;

  padding:24px 19px;

  border-radius:24px;

  background:var(--yellow);

}

.hero h1{

  position:relative;

  z-index:2;

  max-width:310px;

  margin:0 0 8px;

  font-size:30px;

  line-height:1.03;

  font-weight:900;

  letter-spacing:-1px;

}

.hero p{

  position:relative;

  z-index:2;

  max-width:300px;

  margin:0;

  font-size:14px;

}

.hero-bg{

  position:absolute;

  right:-15px;

  bottom:-25px;

  font-size:90px;

  font-weight:900;

  opacity:.08;

  transform:rotate(-8deg);

}

/* SERVICES */

.services{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.service{

  min-height:130px;

  padding:17px;

  text-align:left;

  background:#fff;

  border:1px solid var(--line);

  border-radius:20px;

  transition:.15s;

}

.service:active{

  transform:scale(.97);

}

.service-icon{

  margin-bottom:14px;

  font-size:30px;

}

.service-title{

  display:block;

  font-size:17px;

  font-weight:900;

}

.service-text{

  display:block;

  margin-top:4px;

  color:var(--gray);

  font-size:12px;

}

/* PARTNER */

.partner{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:14px;

  padding:15px;

  border-radius:20px;

  background:#111;

  color:#fff;

}

.partner small{

  color:#bbb;

}

.partner-logo{

  padding:9px 11px;

  border-radius:12px;

  background:#fff;

  color:#111;

  font-weight:900;

}

/* TITLES */

.back{

  padding:5px 0 14px;

  border:0;

  background:none;

  font-weight:800;

}

.title{

  margin:0 0 15px;

  font-size:27px;

  font-weight:900;

}

/* STORE */

.search{

  width:100%;

  margin-bottom:10px;

  padding:14px 15px;

  border:1px solid var(--line);

  border-radius:15px;

  outline:none;

  background:#fafafa;

}

.categories{

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding-bottom:10px;

}

.categories button{

  flex-shrink:0;

  padding:9px 12px;

  border:0;

  border-radius:12px;

  background:#eee;

}

.categories button.active{

  background:var(--yellow);

  font-weight:800;

}

.products{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.product{

  display:flex;

  flex-direction:column;

  min-height:190px;

  padding:11px;

  border:1px solid var(--line);

  border-radius:17px;

  background:#fff;

}

.product-image{

  display:grid;

  place-items:center;

  height:85px;

  margin-bottom:9px;

  border-radius:13px;

  background:#f3f3f0;

  font-size:36px;

}

.product-name{

  font-size:14px;

  font-weight:700;

  line-height:1.2;

}

.product-price{

  margin:7px 0;

  font-size:17px;

  font-weight:900;

}

.add-button{

  width:100%;

  margin-top:auto;

  padding:10px;

  border:0;

  border-radius:12px;

  background:var(--yellow);

  font-weight:900;

}

/* FORMS */

.notice{

  margin-bottom:12px;

  padding:12px;

  border-radius:14px;

  background:#fff7ca;

  font-size:13px;

}

.form{

  padding:15px;

  border:1px solid var(--line);

  border-radius:20px;

  background:#fff;

}

.field{

  margin-bottom:11px;

}

.field label{

  display:block;

  margin-bottom:5px;

  color:#777;

  font-size:12px;

}

.field input,

.field textarea{

  width:100%;

  padding:13px;

  border:1px solid var(--line);

  border-radius:13px;

  outline:none;

  background:#fafafa;

}

.field textarea{

  min-height:90px;

  resize:vertical;

}

.primary{

  width:100%;

  padding:14px;

  border:0;

  border-radius:14px;

  background:var(--yellow);

  font-weight:900;

}

/* CART */

.cart-list{

  display:grid;

  gap:9px;

}

.cart-item{

  display:grid;

  grid-template-columns:1fr auto;

  gap:10px;

  padding:12px;

  border:1px solid var(--line);

  border-radius:16px;

  background:#fff;

}

.cart-item-name{

  font-weight:800;

}

.cart-item-price{

  margin-top:4px;

  color:#666;

  font-size:13px;

}

.quantity{

  display:flex;

  align-items:center;

  gap:7px;

}

.quantity button{

  width:32px;

  height:32px;

  border:0;

  border-radius:10px;

  background:#eee;

  font-weight:900;

}

.quantity strong{

  min-width:18px;

  text-align:center;

}

.summary{

  margin-top:12px;

  padding:15px;

  border:1px solid var(--line);

  border-radius:18px;

  background:#fff;

}

.summary-line{

  display:flex;

  justify-content:space-between;

  margin:7px 0;

}

.total{

  display:flex;

  justify-content:space-between;

  margin-top:10px;

  padding-top:10px;

  border-top:1px solid var(--line);

  font-size:21px;

  font-weight:900;

}

.empty{

  padding:45px 15px;

  border:1px dashed #ddd;

  border-radius:18px;

  text-align:center;

  color:#777;

}

/* BOTTOM NAV */

.bottom-nav{

  position:fixed;

  bottom:0;

  left:50%;

  z-index:90;

  width:min(600px,100%);

  transform:translateX(-50%);

  display:grid;

  grid-template-columns:repeat(4,1fr);

  padding:7px 8px calc(7px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:#fff;

}

.nav-button{

  padding:6px 2px;

  border:0;

  background:none;

  color:#777;

  font-size:11px;

}

.nav-icon{

  display:block;

  margin-bottom:2px;

  font-size:19px;

}

.nav-button.active{

  color:#111;

}

.nav-button.active .nav-icon{

  display:inline-block;

  padding:2px 7px;

  border-radius:10px;

  background:var(--yellow);

}

/* DESKTOP */

@media(min-width:700px){

  body{

    background:#ddd;

  }

  .app{

    box-shadow:0 0 30px #bbb;

  }

  .content{

    padding-bottom:30px;

  }

  .bottom-nav{

    position:static;

    transform:none;

    margin:auto;

    border-top:1px solid var(--line);

  }

}

</style>

</head>

<body>

<div class="app">

<header class="header">

  <div class="header-row">

    <div>

      <div class="logo">O Go</div>

      <div class="location">📍 Осакаровка</div>

    </div>

    <button class="cart-button" onclick="openPage('cart')">

      🛒 Себет

      <span class="cart-count" id="cartCount">0</span>

    </button>

  </div>

</header>

<main class="content">

<!-- HOME -->

<section id="home" class="page active">

  <div class="hero">

    <div class="hero-bg">O Go</div>

    <h1>Керектінің бәрі бір жерде</h1>

    <p>

      Дүкен, такси, доставка және еда.

      Осакаровка үшін O Go.

    </p>

  </div>

  <div class="services">

    <button class="service" onclick="openPage('store')">

      <div class="service-icon">🛒</div>

      <span class="service-title">Дүкен</span>

      <span class="service-text">

        Азық-түлік және тауарлар

      </span>

    </button>

    <button class="service" onclick="openPage('taxi')">

      <div class="service-icon">🚕</div>

      <span class="service-title">Такси</span>

      <span class="service-text">

        Қай жерден → қай жерге

      </span>

    </button>

    <button class="service" onclick="openPage('delivery')">

      <div class="service-icon">📦</div>

      <span class="service-title">Доставка</span>

      <span class="service-text">

        Затты мекенжайға жеткізу

      </span>

    </button>

    <button class="service" onclick="openPage('food')">

      <div class="service-icon">🍔</div>

      <span class="service-title">Еда</span>

      <span class="service-text">

        Тамаққа тапсырыс беру

      </span>

    </button>

  </div>

  <div class="partner">

    <div>

      <b>Дүкен серіктесі</b>

      <br>

      <small>Азық-түлік бөлімі</small>

    </div>

    <div class="partner-logo">

      АЙБОЛИТ

    </div>

  </div>

</section>

<!-- STORE -->

<section id="store" class="page">

  <button class="back" onclick="openPage('home')">

    ← Басты бет

  </button>

  <h2 class="title">Дүкен</h2>

  <input

    id="search"

    class="search"

    type="search"

    placeholder="Өнім іздеу..."

    oninput="renderProducts()"

  >

  <div id="categories" class="categories"></div>

  <div id="products" class="products"></div>

</section>

<!-- CART -->

<section id="cart" class="page">

  <button class="back" onclick="openPage('store')">

    ← Дүкен

  </button>

  <h2 class="title">Себет</h2>

  <div id="cartList"></div>

  <div id="cartSummary"></div>

</section>

<!-- TAXI -->

<section id="taxi" class="page">

  <button class="back" onclick="openPage('home')">

    ← Басты бет

  </button>

  <h2 class="title">Такси</h2>

  <div class="notice">

    💬 Онлайн төлем жоқ.

    Тапсырыс WhatsApp арқылы қабылданады.

  </div>

  <div class="form">

    <div class="field">

      <label>Қай жерден</label>

      <input

        id="taxiFrom"

        placeholder="Мекенжай"

      >

    </div>

    <div class="field">

      <label>Қай жерге</label>

      <input

        id="taxiTo"

        placeholder="Мекенжай"

      >

    </div>

    <div class="field">

      <label>Телефон</label>

      <input

        id="taxiPhone"

        type="tel"

        placeholder="+7 777 000 00 00"

      >

    </div>

    <button

      class="primary"

      onclick="sendTaxi()"

    >

      WhatsApp арқылы тапсырыс беру

    </button>

  </div>

</section>

<!-- DELIVERY -->

<section id="delivery" class="page">

  <button class="back" onclick="openPage('home')">

    ← Басты бет

  </button>

  <h2 class="title">Доставка</h2>

  <div class="form">

    <div class="field">

      <label>Қай жерден алу керек</label>

      <input

        id="deliveryFrom"

        placeholder="Мекенжай"

      >

    </div>

    <div class="field">

      <label>Қай жерге жеткізу керек</label>

      <input

        id="deliveryTo"

        placeholder="Мекенжай"

      >

    </div>

    <div class="field">

      <label>Телефон</label>

      <input

        id="deliveryPhone"

        type="tel"

        placeholder="+7 777 000 00 00"

      >

    </div>

    <div class="field">

      <label>Не жеткізу керек?</label>

      <input

        id="deliveryItem"

        placeholder="Зат / құжат / тауар"

      >

    </div>

    <div class="field">

      <label>Қосымша ақпарат</label>

      <textarea

        id="deliveryNote"

        placeholder="Қосымша ақпарат"

      ></textarea>

    </div>

    <button

      class="primary"

      onclick="sendDelivery()"

    >

      WhatsApp арқылы тапсырыс беру

    </button>

  </div>

</section>

<!-- FOOD -->

<section id="food" class="page">

  <button class="back" onclick="openPage('home')">

    ← Басты бет

  </button>

  <h2 class="title">Еда</h2>

  <div class="notice">

    🍔 Тамаққа тапсырысты WhatsApp арқылы қабылдаймыз.

  </div>

  <div class="form">

    <div class="field">

      <label>Тапсырыс</label>

      <textarea

        id="foodOrder"

        placeholder="Мысалы: 2 бургер, 1 пицца..."

      ></textarea>

    </div>

    <div class="field">

      <label>Мекенжай</label>

      <input

        id="foodAddress"

        placeholder="Жеткізу мекенжайы"

      >

    </div>

    <div class="field">

      <label>Телефон</label>

      <input

        id="foodPhone"

        type="tel"

        placeholder="+7 777 000 00 00"

      >

    </div>

    <button

      class="primary"

      onclick="sendFood()"

    >

      WhatsApp арқылы тапсырыс беру

    </button>

  </div>

</section>

</main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button

    class="nav-button active"

    data-page="home"

    onclick="openPage('home')"

  >

    <span class="nav-icon">⌂</span>

    Басты

  </button>

  <button

    class="nav-button"

    data-page="store"

    onclick="openPage('store')"

  >

    <span class="nav-icon">🛒</span>

    Дүкен

  </button>

  <button

    class="nav-button"

    data-page="taxi"

    onclick="openPage('taxi')"

  >

    <span class="nav-icon">🚕</span>

    Такси

  </button>

  <button

    class="nav-button"

    data-page="cart"

    onclick="openPage('cart')"

  >

    <span class="nav-icon">🧺</span>

    Себет

  </button>

</nav>

</div>

<script>

/* =========================

   SETTINGS

========================= */

const WHATSAPP = "87756108898";

/* =========================

   CATEGORIES

========================= */

const categories = [

  "Барлығы",

  "Азық-түлік",

  "Сусындар",

  "Сүт өнімдері",

  "Нан-тоқаш",

  "Жеміс-көкөніс",

  "Тәттілер",

  "Ет өнімдері",

  "Тұрмыс",

  "Балалар"

];

/* =========================

   PRODUCTS

========================= */

const productBase = [

  ["Нан","Нан-тоқаш",450,"🍞"],

  ["Батон","Нан-тоқаш",500,"🥖"],

  ["Сүт 1 л","Сүт өнімдері",550,"🥛"],

  ["Айран 1 л","Сүт өнімдері",520,"🥛"],

  ["Қаймақ","Сүт өнімдері",750,"🥛"],

  ["Су 1.5 л","Сусындар",300,"💧"],

  ["Шырын","Сусындар",850,"🧃"],

  ["Кола","Сусындар",700,"🥤"],

  ["Шай","Сусындар",1200,"🍵"],

  ["Макарон","Азық-түлік",650,"🍝"],

  ["Күріш","Азық-түлік",900,"🍚"],

  ["Қант 1 кг","Азық-түлік",600,"🧂"],

  ["Тұз","Азық-түлік",250,"🧂"],

  ["Ұн 2 кг","Азық-түлік",900,"🌾"],

  ["Май","Азық-түлік",1000,"🫗"],

  ["Алма","Жеміс-көкөніс",900,"🍎"],

  ["Банан","Жеміс-көкөніс",800,"🍌"],

  ["Картоп","Жеміс-көкөніс",350,"🥔"],

  ["Сәбіз","Жеміс-көкөніс",300,"🥕"],

  ["Қияр","Жеміс-көкөніс",700,"🥒"],

  ["Шоколад","Тәттілер",750,"🍫"],

  ["Печенье","Тәттілер",650,"🍪"],

  ["Кәмпит","Тәттілер",1000,"🍬"],

  ["Шұжық","Ет өнімдері",1800,"🥩"],

  ["Тауық еті","Ет өнімдері",2400,"🍗"],

  ["Фарш","Ет өнімдері",2200,"🥩"],

  ["Ыдыс жуғыш","Тұрмыс",950,"🧴"],

  ["Кір жуғыш ұнтақ","Тұрмыс",1800,"🧼"],

  ["Дәретхана қағазы","Тұрмыс",1200,"🧻"],

  ["Балалар жөргегі","Балалар",4500,"🧸"],

  ["Балалар тағамы","Балалар",2500,"🍼"]

];

let products = [];

for(let i = 0; i < 35; i++){

  productBase.forEach((item,index)=>{

    products.push({

      id: i * productBase.length + index,

      name:

        item[0] +

        (i === 0 ? "" : " " + (i + 1)),

      category:item[1],

      price:item[2],

      icon:item[3]

    });

  });

}

/* =========================

   CART

========================= */

let cart =

  JSON.parse(

    localStorage.getItem("ogo_cart") || "{}"

  );

let currentCategory = "Барлығы";

/* =========================

   HELPERS

========================= */

function money(number){

  return new Intl.NumberFormat("kk-KZ")

    .format(number) + " ₸";

}

function cartQuantity(){

  return Object.values(cart)

    .reduce(

      (total,quantity)=>total + quantity,

      0

    );

}

function saveCart(){

  localStorage.setItem(

    "ogo_cart",

    JSON.stringify(cart)

  );

  updateCartCount();

}

function updateCartCount(){

  document.getElementById("cartCount")

    .textContent = cartQuantity();

}

/* =========================

   PAGE NAVIGATION

========================= */

function openPage(page){

  document

    .querySelectorAll(".page")

    .forEach(section=>{

      section.classList.remove("active");

    });

  const selected =

    document.getElementById(page);

  if(selected){

    selected.classList.add("active");

  }

  document

    .querySelectorAll(".nav-button")

    .forEach(button=>{

      button.classList.toggle(

        "active",

        button.dataset.page === page

      );

    });

  if(page === "store"){

    renderProducts();

  }

  if(page === "cart"){

    renderCart();

  }

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}

/* =========================

   CATEGORIES

========================= */

function renderCategories(){

  const container =

    document.getElementById("categories");

  container.innerHTML =

    categories.map(category=>`

      <button

        class="${category === currentCategory ? "active" : ""}"

        onclick='

          currentCategory=${JSON.stringify(category)};

          renderProducts();

        '

      >

        ${category}

      </button>

    `).join("");

}

/* =========================

   PRODUCTS

========================= */

function renderProducts(){

  renderCategories();

  const search =

    document

      .getElementById("search")

      .value

      .toLowerCase()

      .trim();

  let list =

    products.filter(product=>{

      const categoryMatch =

        currentCategory === "Барлығы" ||

        product.category === currentCategory;

      const searchMatch =

        product.name

          .toLowerCase()

          .includes(search);

      return categoryMatch && searchMatch;

    });

  document.getElementById("products")

    .innerHTML =

    list.map(product=>`

      <article class="product">

        <div class="product-image">

          ${product.icon}

        </div>

        <div class="product-name">

          ${product.name}

        </div>

        <div class="product-price">

          ${money(product.price)}

        </div>

        <button

          class="add-button"

          onclick="addToCart(${product.id})"

        >

          + Себетке

        </button>

      </article>

    `).join("");

}

/* =========================

   ADD TO CART

========================= */

function addToCart(id){

  cart[id] =

    (cart[id] || 0) + 1;

  saveCart();

}

/* =========================

   CHANGE QUANTITY

========================= */

function changeQuantity(id,change){

  cart[id] =

    (cart[id] || 0) + change;

  if(cart[id] <= 0){

    delete cart[id];

  }

  saveCart();

  renderCart();

}

/* =========================

   RENDER CART

========================= */

function renderCart(){

  const list =

    document.getElementById("cartList");

  const summary =

    document.getElementById("cartSummary");

  const ids =

    Object.keys(cart).map(Number);

  if(ids.length === 0){

    list.innerHTML = `

      <div class="empty">

        🛒

        <br><br>

        Себет бос

      </div>

    `;

    summary.innerHTML = "";

    return;

  }

  let total = 0;

  list.innerHTML = `

    <div class="cart-list">

      ${ids.map(id=>{

        const product =

          products.find(

            item=>item.id === id

          );

        const quantity =

          cart[id];

        const productTotal =

          product.price * quantity;

        total += productTotal;

        return `

          <div class="cart-item">

            <div>

              <div class="cart-item-name">

                ${product.icon}

                ${product.name}

              </div>

              <div class="cart-item-price">

                ${money(product.price)}

                × ${quantity}

              </div>

            </div>

            <div class="quantity">

              <button

                onclick="changeQuantity(${id},-1)"

              >

                −

              </button>

              <strong>

                ${quantity}

              </strong>

              <button

                onclick="changeQuantity(${id},1)"

              >

                +

              </button>

            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;

  summary.innerHTML = `

    <div class="summary">

      <div class="summary-line">

        <span>Тауар саны</span>

        <b>${cartQuantity()} дана</b>

      </div>

      <div class="summary-line">

        <span>Тауарлар сомасы</span>

        <b>${money(total)}</b>

      </div>

      <div class="total">

        <span>Барлығы</span>

        <span>${money(total)}</span>

      </div>

      <br>

      <div class="field">

        <label>

          Мекенжай

        </label>

        <input

          id="cartAddress"

          placeholder="Жеткізу мекенжайы"

        >

      </div>

      <div class="field">

        <label>

          Телефон

        </label>

        <input

          id="cartPhone"

          type="tel"

          placeholder="+7 777 000 00 00"

        >

      </div>

      <button

        class="primary"

        onclick="sendCartOrder()"

      >

        WhatsApp арқылы тапсырыс беру

      </button>

      <p style="

        color:#777;

        font-size:12px;

        margin-bottom:0;

      ">

        Онлайн төлем жоқ.

        Тапсырыс WhatsApp арқылы жіберіледі.

      </p>

    </div>

  `;

}

/* =========================

   WHATSAPP

========================= */

function sendWhatsApp(message){

  const url =

    "https://wa.me/" +

    WHATSAPP +

    "?text=" +

    encodeURIComponent(message);

  window.open(

    url,

    "_blank"

  );

}

/* =========================

   STORE ORDER

========================= */

function sendCartOrder(){

  const address =

    document

      .getElementById("cartAddress")

      .value

      .trim();

  const phone =

    document

      .getElementById("cartPhone")

      .value

      .trim();

  if(!address || !phone){

    alert(

      "Телефон мен мекенжайды толтырыңыз."

    );

    return;

  }

  const ids =

    Object.keys(cart).map(Number);

  let total = 0;

  const lines =

    ids.map(id=>{

      const product =

        products.find(

          item=>item.id === id

        );

      const quantity =

        cart[id];

      total +=

        product.price * quantity;

      return (

        "• " +

        product.name +

        " — " +

        quantity +

        " × " +

        money(product.price)

      );

    });

  const message =

`O Go — ДҮКЕН ТАПСЫРЫСЫ

${lines.join("\n")}

Тауар саны: ${cartQuantity()} дана

БАРЛЫҒЫ: ${money(total)}

Мекенжай:

${address}

Телефон:

${phone}

Төлем: WhatsApp арқылы`;

  sendWhatsApp(message);

}
